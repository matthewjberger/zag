name: Rust

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # The reflection tests check the hand-built fact tables against what the
      # compiler resolved. Without zig they skip themselves, so it is installed
      # here rather than left to chance.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # zag-verify compiles the checked in ports, so the layout assertions the
      # emitter wrote are checked by the build itself. A layout that only holds
      # on one target fails on the other two.
      - run: cargo test --workspace

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets -- -D warnings

  regenerated:
    name: Checked in ports are not stale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The test suite already compares the library pipeline against every
      # expected directory. This runs the same thing through the binary, so the
      # command line path cannot drift away from the library path unnoticed.
      - uses: extractions/setup-just@v2
      - run: just examples
      - name: The pipeline output matches what is checked in
        run: git diff --exit-code examples

  examples:
    name: Example programs build on their own
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      # Each example is a standalone project, so it is built from inside its
      # own directory rather than through anything this repository provides.
      - name: Build and run every example
        run: |
          for directory in examples/*/; do
            echo "== $directory"
            (cd "$directory" && zig build run)
          done

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all
